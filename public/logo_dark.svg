<svg width="480" height="96" viewBox="0 0 480 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="dark-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient 1 -->
    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ring Gradient 2 -->
    <linearGradient id="orbit-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- AI Gradient -->
    <linearGradient id="text-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Diamond Core Gradient -->
    <linearGradient id="diamond-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="point-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="48" cy="48" r="42" fill="url(#dark-bg-glow)" />

  <!-- Geometric Hexagonal Orbit Perimeter -->
  <polygon points="48,10 81,29 81,67 48,86 15,67 15,29"
           fill="none"
           stroke="#818cf8"
           stroke-width="0.75"
           stroke-dasharray="3 4"
           opacity="0.35" />

  <!-- Orbit Track 1: Inclined Violet/Magenta -->
  <g>
    <ellipse cx="48" cy="48" rx="34" ry="15"
             fill="none"
             stroke="url(#orbit-grad-1)"
             stroke-width="2"
             transform="rotate(-28 48 48)"
             filter="url(#soft-glow)"
             opacity="0.9" />
    <!-- Agent Node A -->
    <circle cx="76" cy="34" r="3" fill="#22d3ee" filter="url(#point-glow)" />
    <!-- Agent Node B -->
    <circle cx="20" cy="62" r="2.5" fill="#f43f5e" filter="url(#point-glow)" />
  </g>

  <!-- Orbit Track 2: Inclined Cyan/Indigo -->
  <g>
    <ellipse cx="48" cy="48" rx="34" ry="15"
             fill="none"
             stroke="url(#orbit-grad-2)"
             stroke-width="1.8"
             transform="rotate(38 48 48)"
             filter="url(#soft-glow)"
             opacity="0.85" />
    <!-- Agent Node C -->
    <circle cx="24" cy="32" r="3" fill="#c084fc" filter="url(#point-glow)" />
    <!-- Agent Node D -->
    <circle cx="72" cy="64" r="2.5" fill="#34d399" filter="url(#point-glow)" />
  </g>

  <!-- Central Radiant Diamond Star -->
  <g>
    
    
    <polygon points="48,41 53,48 48,55 43,48" fill="#ffffff" />
    <circle cx="48" cy="48" r="2.5" fill="#4f46e5" />
    <circle cx="48" cy="48" r="1.2" fill="#ffffff" />
  </g>

  <!-- Subtle Sparks -->
  <circle cx="48" cy="14" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="78" cy="50" r="1" fill="#22d3ee" opacity="0.8" />
  <circle cx="48" cy="82" r="1.2" fill="#c084fc" opacity="0.85" />
  <circle cx="18" cy="46" r="1" fill="#f43f5e" opacity="0.8" />

  <!-- Typography Brand Header -->
  <!-- "Nexus" in Crisp Polar White -->
  <text x="106" y="58"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36"
        font-weight="800"
        letter-spacing="-0.03em"
        fill="#f8fafc">
    Nexus<tspan fill="url(#text-ai-grad)">AI</tspan>
  </text>
</svg>

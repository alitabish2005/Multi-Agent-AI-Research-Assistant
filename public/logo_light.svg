<svg width="480" height="96" viewBox="0 0 480 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow for Light Theme -->
    <radialGradient id="light-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="light-orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="light-orbit-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="light-text-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="light-diamond-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <filter id="light-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="48" cy="48" r="42" fill="url(#light-bg-glow)" />

  <!-- Geometric Hexagonal Perimeter -->
  <polygon points="48,10 81,29 81,67 48,86 15,67 15,29"
           fill="none"
           stroke="#6366f1"
           stroke-width="0.8"
           stroke-dasharray="3 4"
           opacity="0.4" />

  <!-- Orbit Track 1 -->
  <g>
    <ellipse cx="48" cy="48" rx="34" ry="15"
             fill="none"
             stroke="url(#light-orbit-grad-1)"
             stroke-width="2.2"
             transform="rotate(-28 48 48)"
             filter="url(#light-soft-glow)"
             opacity="0.95" />
    <circle cx="76" cy="34" r="3" fill="#0284c7" />
    <circle cx="20" cy="62" r="2.5" fill="#e11d48" />
  </g>

  <!-- Orbit Track 2 -->
  <g>
    <ellipse cx="48" cy="48" rx="34" ry="15"
             fill="none"
             stroke="url(#light-orbit-grad-2)"
             stroke-width="2"
             transform="rotate(38 48 48)"
             filter="url(#light-soft-glow)"
             opacity="0.9" />
    <circle cx="24" cy="32" r="3" fill="#7c3aed" />
    <circle cx="72" cy="64" r="2.5" fill="#059669" />
  </g>

  <!-- Central Radiant Diamond Star -->
  <g>
    
    
    <polygon points="48,41 53,48 48,55 43,48" fill="#ffffff" />
    <circle cx="48" cy="48" r="2" fill="#7c3aed" />
  </g>

  <!-- Typography Brand Header -->
  <text x="106" y="58"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36"
        font-weight="800"
        letter-spacing="-0.03em"
        fill="#0f172a">
    Nexus<tspan fill="url(#light-text-ai-grad)">AI</tspan>
  </text>
</svg>

<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nexus-avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="nexus-avatar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="20" cy="20" r="18" fill="url(#nexus-avatar-glow)" />

  <!-- Outer Subtle Ring -->
  <circle cx="20" cy="20" r="15" stroke="url(#nexus-avatar-grad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Inner Concentric Orbit Ring -->
  <circle cx="20" cy="20" r="10" stroke="#818cf8" stroke-width="1.2" opacity="0.5" />

  <!-- Tri-Node Agent Cluster (Clean Circles) -->
  <circle cx="20" cy="10" r="2.2" fill="#818cf8" />
  <circle cx="28.66" cy="25" r="2.2" fill="#a855f7" />
  <circle cx="11.34" cy="25" r="2.2" fill="#06b6d4" />

  <!-- Connecting Vector Lines -->
  <line x1="20" y1="10" x2="28.66" y2="25" stroke="#94a3b8" stroke-width="0.8" opacity="0.4" />
  <line x1="28.66" y1="25" x2="11.34" y2="25" stroke="#94a3b8" stroke-width="0.8" opacity="0.4" />
  <line x1="11.34" y1="25" x2="20" y2="10" stroke="#94a3b8" stroke-width="0.8" opacity="0.4" />

  <!-- Luminous Central Core Node (Circular) -->
  <circle cx="20" cy="20" r="3.5" fill="url(#nexus-avatar-grad)" />
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
</svg>
